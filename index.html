<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur de rythmes d'entraînement | Tarmac Coaching</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #e11d48;
      --accent-soft: #fff1f2;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --row-white: #ffffff;
      --row-r1: #f3f4f6;
      --row-r2: #dbfce7;
      --row-lt: #fef9c2;
      --row-r3: #ffeed4;
      --row-r45: #ffe4e3;
      --z1: #e0f2fe; --z1-t: #0369a1;
      --z2: #dcfce7; --z2-t: #15803d;
      --z3: #fef9c3; --z3-t: #a16207;
      --z4: #ffedd5; --z4-t: #c2410c;
      --z5: #fee2e2; --z5-t: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 20px 22px;
      border-radius: 14px 14px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    header .brand {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fda4af;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card {
      background: var(--card);
      border-radius: 0 0 14px 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
      padding: 20px;
      border: 1px solid var(--border);
      border-top: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 20px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 8px;
    }

    /* Boutons radio stylisés en sélecteur segmenté */
    .radio-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .radio-option {
      position: relative;
    }

    .radio-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.15s ease;
      text-align: center;
    }

    .radio-option label span.sub {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
    }

    .radio-option input:checked + label {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .radio-option input:checked + label span.sub {
      color: #be123c;
    }

    /* Saisie HH:MM:SS */
    .time-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-box input {
      width: 100%;
      padding: 10px 6px;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .time-box input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .time-box span {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .time-sep {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 18px;
    }

    /* Tableau des rythmes */
    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    thead th {
      background: var(--row-white);
      color: var(--primary);
      font-weight: 600;
      text-align: left;
      padding: 11px 12px;
      font-size: 0.82rem;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    thead th.num, tbody td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    thead th.center, tbody td.center {
      text-align: center;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr.row-r1 {
      background: var(--row-r1);
    }

    tbody tr.row-r2 {
      background: var(--row-r2);
    }

    tbody tr.row-lt {
      background: var(--row-lt);
    }

    tbody tr.row-r3 {
      background: var(--row-r3);
    }

    tbody tr.row-r4,
    tbody tr.row-r5 {
      background: var(--row-r45);
    }

    tbody td {
      padding: 12px;
      vertical-align: middle;
    }

    .zone-title {
      font-weight: 600;
      color: var(--primary);
      display: block;
    }

    .zone-subtime {
      display: inline-block;
      margin-top: 3px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 7px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .code-badge {
      display: inline-block;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--primary);
      background: #e2e8f0;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .row-r2 .code-badge {
      background: var(--accent);
      color: #fff;
    }

    .pace-val {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--primary);
    }

    .lactate-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .z1 { background: var(--z1); color: var(--z1-t); }
    .z2 { background: var(--z2); color: var(--z2-t); }
    .z3 { background: var(--z3); color: var(--z3-t); }
    .z4 { background: var(--z4); color: var(--z4-t); }
    .z5 { background: var(--z5); color: var(--z5-t); }

    footer {
      margin-top: 18px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (min-width: 540px) {
      .controls {
        grid-template-columns: 1.1fr 1fr;
        align-items: start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="brand">Tarmac Coaching</div>
        <h1>Calculateur de rythmes d'entraînement</h1>
      </div>
    </header>

    <div class="card">
      <div class="controls">
        <div>
          <span class="field-label">1. Épreuve visée</span>
          <div class="radio-group" role="radiogroup" aria-label="Épreuve visée">
            <div class="radio-option">
              <input type="radio" id="dist-marathon" name="distance" value="marathon" checked />
              <label for="dist-marathon">
                Marathon
                <span class="sub">42,2 km</span>
              </label>
            </div>
            <div class="radio-option">
              <input type="radio" id="dist-demi" name="distance" value="demi" />
              <label for="dist-demi">
                Demi-marathon
                <span class="sub">21,1 km</span>
              </label>
            </div>
          </div>
        </div>

        <div>
          <span class="field-label">2. Temps visé (hh:mm:ss)</span>
          <div class="time-inputs">
            <div class="time-box">
              <input type="number" id="hours" min="0" max="9" value="3" aria-label="Heures" />
              <span>Heures</span>
            </div>
            <div class="time-sep">:</div>
            <div class="time-box">
              <input type="number" id="minutes" min="0" max="59" value="45" aria-label="Minutes" />
              <span>Min</span>
            </div>
            <div class="time-sep">:</div>
            <div class="time-box">
              <input type="number" id="seconds" min="0" max="59" value="0" aria-label="Secondes" />
              <span>Sec</span>
            </div>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Allure / Objectif</th>
              <th class="center">Code</th>
              <th class="num">min/km</th>
              <th class="num">km/h</th>
              <th class="num">mph</th>
              <th class="center">Zone</th>
            </tr>
          </thead>
          <tbody id="paces-body">
            <!-- Rempli dynamiquement -->
          </tbody>
        </table>
      </div>

      <footer id="copyright-footer">
        &copy; Tarmac Coaching 2018-<span id="current-year"></span> &mdash; Reproduction interdite sans autorisation de l'auteur
      </footer>
    </div>
  </div>

  <script>
    // Année courante automatique pour le copyright (2018-[année en cours])
    document.getElementById("current-year").textContent = new Date().getFullYear();

    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const distRadios = document.querySelectorAll('input[name="distance"]');
    const tbody = document.getElementById("paces-body");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    // Formate une durée en secondes vers mm:ss (arrondi à la seconde comme Google Sheets)
    function formatPace(totalSeconds) {
      const rounded = Math.max(1, Math.round(totalSeconds));
      const m = Math.floor(rounded / 60);
      const s = rounded % 60;
      return `${pad(m)}:${pad(s)}`;
    }

    // Formate une durée totale en hh:mm:ss ou mm:ss
    function formatDuration(totalSeconds) {
      const rounded = Math.max(0, Math.round(totalSeconds));
      const h = Math.floor(rounded / 3600);
      const m = Math.floor((rounded % 3600) / 60);
      const s = rounded % 60;
      if (h > 0) {
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }
      return `${pad(m)}:${pad(s)}`;
    }

    function formatSpeed(val) {
      return val.toFixed(1).replace(".", ",");
    }

    function getSelectedDistance() {
      const checked = document.querySelector('input[name="distance"]:checked');
      return checked ? checked.value : "marathon";
    }

    function saveState(dist, h, m, s) {
      try {
        localStorage.setItem("tarmac_calc_v1", JSON.stringify({ dist, h, m, s }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem("tarmac_calc_v1");
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.dist === "demi") {
          document.getElementById("dist-demi").checked = true;
        } else {
          document.getElementById("dist-marathon").checked = true;
        }
        if (typeof data.h === "number") hoursEl.value = data.h;
        if (typeof data.m === "number") minutesEl.value = data.m;
        if (typeof data.s === "number") secondsEl.value = data.s;
      } catch (e) {}
    }

    function updateTable() {
      const dist = getSelectedDistance();
      const h = Math.max(0, Math.min(9, parseInt(hoursEl.value, 10) || 0));
      const m = Math.max(0, Math.min(59, parseInt(minutesEl.value, 10) || 0));
      const s = Math.max(0, Math.min(59, parseInt(secondsEl.value, 10) || 0));

      saveState(dist, h, m, s);

      const targetSeconds = h * 3600 + m * 60 + s;
      if (targetSeconds <= 0) return;

      // Exactement les mêmes facteurs que dans l'onglet Calculateur (42.2 et 21.1)
      const isMarathon = dist === "marathon";
      const r2Seconds = isMarathon ? targetSeconds / 42.2 : targetSeconds / 21.1;

      // Option A : allure pivot marathon (+15 s/km en mode Demi-marathon)
      const pivotMarathonSeconds = isMarathon ? r2Seconds : r2Seconds + 15;

      const r1Seconds = pivotMarathonSeconds + 30;
      const ltSeconds = pivotMarathonSeconds - 15;
      const r3Seconds = ltSeconds - 15;
      const r4Seconds = r3Seconds - 21;
      const r5Seconds = r4Seconds - 24;

      const time10k = formatDuration(r3Seconds * 10);
      const time5k = formatDuration(r4Seconds * 5);
      const targetFormatted = formatDuration(targetSeconds);

      const rows = [
        {
          label: "Endurance fondamentale",
          subtime: null,
          code: "R1",
          paceSec: r1Seconds,
          zone: "Z1",
          zoneClass: "z1",
          rowClass: "row-r1"
        },
        {
          label: isMarathon ? "Endurance Marathon" : "Endurance Demi-marathon",
          subtime: targetFormatted,
          code: "R2",
          paceSec: r2Seconds,
          zone: "Z2",
          zoneClass: "z2",
          rowClass: "row-r2"
        },
        {
          label: "Endurance Seuil lactique",
          subtime: null,
          code: "LT",
          paceSec: ltSeconds,
          zone: "Z3",
          zoneClass: "z3",
          rowClass: "row-lt"
        },
        {
          label: "Performance 10 km",
          subtime: time10k,
          code: "R3",
          paceSec: r3Seconds,
          zone: "Z4",
          zoneClass: "z4",
          rowClass: "row-r3"
        },
        {
          label: "Performance 5 km",
          subtime: time5k,
          code: "R4",
          paceSec: r4Seconds,
          zone: "Z5",
          zoneClass: "z5",
          rowClass: "row-r4"
        },
        {
          label: "VO2max Sprint",
          subtime: null,
          code: "R5",
          paceSec: r5Seconds,
          zone: "Z5",
          zoneClass: "z5",
          rowClass: "row-r5"
        }
      ];

      tbody.innerHTML = rows.map(row => {
        const kmh = 3600 / row.paceSec;
        const mph = kmh / 1.609344;
        return `
          <tr class="${row.rowClass}">
            <td>
              <span class="zone-title">${row.label}</span>
              ${row.subtime ? `<span class="zone-subtime">${row.subtime}</span>` : ""}
            </td>
            <td class="center"><span class="code-badge">${row.code}</span></td>
            <td class="num pace-val">${formatPace(row.paceSec)}</td>
            <td class="num">${formatSpeed(kmh)}</td>
            <td class="num">${formatSpeed(mph)}</td>
            <td class="center"><span class="lactate-pill ${row.zoneClass}">${row.zone}</span></td>
          </tr>
        `;
      }).join("");
    }

    // Basculer automatiquement un temps par défaut cohérent si l'utilisateur change d'épreuve sans avoir modifié le temps
    distRadios.forEach(radio => {
      radio.addEventListener("change", () => {
        const currentTotal = (parseInt(hoursEl.value, 10) || 0) * 3600 + (parseInt(minutesEl.value, 10) || 0) * 60 + (parseInt(secondsEl.value, 10) || 0);
        if (radio.value === "demi" && currentTotal === 3 * 3600 + 45 * 60) {
          hoursEl.value = 1;
          minutesEl.value = 45;
          secondsEl.value = 0;
        } else if (radio.value === "marathon" && currentTotal === 1 * 3600 + 45 * 60) {
          hoursEl.value = 3;
          minutesEl.value = 45;
          secondsEl.value = 0;
        }
        updateTable();
      });
    });

    [hoursEl, minutesEl, secondsEl].forEach(input => {
      input.addEventListener("input", updateTable);
      input.addEventListener("change", updateTable);
    });

    loadState();
    updateTable();
  </script>
</body>
</html>
